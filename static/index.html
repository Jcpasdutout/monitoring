    <title>Monitoring</title>
    <script>
      // Applique le thème mémorisé avant l'affichage, pour éviter un flash.
      try {
        var t = JSON.parse(localStorage.getItem('monitoring.theme'))
        var cadre = window.self !== window.top
        if (t === 'transparent' && cadre) document.documentElement.dataset.bg = 'transparent'
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
